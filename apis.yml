aid: politecnico-di-milano
name: Politecnico di Milano
x-type: university
x-category: Technical University
description: >-
  Politecnico di Milano is Italy's largest technical university — engineering, architecture and design —
  and a public research institution in Milan, ROR 01nffqt88. Like almost every university it is a
  federation of buyers rather than an API producer: there is no developer portal, no public API key, no
  status page and no changelog anywhere on polimi.it. What it does operate itself is real and was verified
  live on 2026-09-01. An open data portal at www.opendata.polimi.it publishes a DCAT-AP_IT catalogue in RDF
  Turtle describing 25 datasets, each with a CSV and a JSON distribution at a stable unauthenticated URL —
  all 25 returned 200 and 38,255 rows on probe, covering the course catalogue, enrolments, graduates,
  mobility, internships, grade distributions and research output under CC BY 4.0. Two separate OAI-PMH 2.0
  endpoints are served from its own hosts: Re.Public@Polimi for research products and POLITESI for theses,
  the latter also harvestable in the DataCite kernel-4 metadata schema. It runs its own Shibboleth identity
  provider, shibidp.polimi.it, whose SAML 2.0 metadata is public and whose entityID is registered in the
  Italian IDEM GARR federation. Against that, the surfaces it does NOT own are recorded as such: the
  authenticated IRIS REST API on its repository host is CINECA's product contract, not the university's,
  and api.polimi.it is a live Kong gateway with no publicly routable endpoint behind it. This profile saves
  contracts only for the surfaces the institution itself operates.
