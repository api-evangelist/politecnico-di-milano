x-coverage:
  state: covered
  reason: covered
  detail: >-
    Four institution-operated surfaces were found, probed and described: a DCAT-AP_IT open data portal with
    25 live datasets, two separate OAI-PMH 2.0 endpoints (Re.Public@Polimi and POLITESI), and a Shibboleth
    IdP publishing SAML 2.0 metadata. A federation membership (IDEM GARR) and a registry registration (ROR)
    were evidenced and recorded without saving either party's contract. One tenant relationship (CINECA
    IRIS REST) was recorded without saving the vendor's contract. Negative findings that bound the profile:
    api.polimi.it is a live Kong 3.6.1 gateway on the institution's domain but returns "no Route matched"
    on every path probed, so no public API sits behind it; CKAN, Socrata and data.json probes of the open
    data portal all 404, which is what led an earlier profile to record no programmatic surface at all;
    github.com/POLIMI is an unrelated individual's organisation from 2013 holding Coursera exercises and is
    NOT the university, so no GitHubOrganization pointer is claimed; no DataCite registrant and no Crossref
    member matching this institution exist; no llms.txt, security.txt, status page, changelog or developer
    portal exists on polimi.it; trasparenza.polimi.it publishes the D.Lgs 33/2013 data catalogue as HTML
    only. Searching in Italian mattered — the AI governance documents and the open data catalogue are
    published only on Italian-language surfaces.
  evidence:
