surfaces:
  - surface: IRIS Re.Public@Polimi OAI-PMH
    base: https://re.public.polimi.it/oai/request
    transport_status_for_errors: 200
    style: OAI-PMH error element
    observed:
      - code: badVerb
        http_status: 200
        body: '<error code="badVerb">Illegal verb</error>'
        probe: https://re.public.polimi.it/oai/request?verb=Bogus
        note: >-
          Verified live. Protocol errors are carried in the response document, not in the HTTP status —
          a client that branches on status code alone will read every OAI-PMH error as success.
    specified_but_not_probed:
      - badArgument
      - badResumptionToken
      - cannotDisseminateFormat
      - idDoesNotExist
      - noRecordsMatch
      - noMetadataFormats
      - noSetHierarchy
    specification: http://www.openarchives.org/OAI/openarchivesprotocol.html#ErrorConditions
    method_note: >-
      Only badVerb was observed on this endpoint. The remaining codes are the OAI-PMH 2.0 specified set and
      are listed as unprobed, not as observed behaviour of this deployment.
  - surface: Open data portal
    base: https://www.opendata.polimi.it
    style: HTTP status, HTML body
    observed:
      - http_status: 404
        content_type: text/html; charset=iso-8859-1
        probe: https://opendata.polimi.it/api/3/action/package_list
        note: >-
          A missing path returns a small HTML 404 (196 bytes) — a real 404, not a soft-200 SPA shell.
          CKAN (/api/3/action/package_list), data.json and /catalog.rdf all 404, which is how this portal
          was previously mis-read as having no programmatic surface at all.
    no_json_error_envelope: true
  - surface: IRIS REST API (vendor contract, CINECA)
    base: https://re.public.polimi.it/rest/api
    style: HTTP status with Spring Security challenge
    observed:
      - http_status: 401
        headers:
          www-authenticate: Basic realm="Spring Security Application"
        body: HTTP Status 401 - Invalid basic authentication token
        note: >-
          Recorded for completeness only. This endpoint's contract belongs to CINECA's IRIS product, not
          to the institution — see apis.yml, x-operator tenant. No contract for it is saved here.
  - surface: api.polimi.it gateway
    base: https://api.polimi.it
    style: Kong JSON error
    observed:
      - http_status: 404
        content_type: application/json
        body: '{"message":"no Route matched with those values","request_id":"..."}'
        probes:
          - https://api.polimi.it/
          - https://api.polimi.it/docs
          - https://api.polimi.it/openapi.json
          - https://api.polimi.it/v1
          - https://api.polimi.it/graphql
          - https://api.polimi.it/health
        note: >-
          The host is a live Kong 3.6.1 gateway on the institution's own domain, but every path probed
